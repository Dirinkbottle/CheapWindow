<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 撕裂效果演示 - 参数调试</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 顶部标题栏 -->
        <header class="header">
            <h1>🎨 WebGL 撕裂效果实时演示</h1>
            <div class="header-info">
                <span class="status" id="status">
                    <span class="status-dot"></span>
                    连接中...
                </span>
                <span class="fps" id="fps">FPS: --</span>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 左侧：预览区域 -->
            <div class="preview-panel">
                <div class="preview-header">
                    <h2>实时预览</h2>
                    <div class="preview-controls">
                        <button class="btn btn-primary" id="triggerBtn">
                            ▶ 触发动画
                        </button>
                        <button class="btn btn-secondary" id="resetBtn">
                            🔄 重置
                        </button>
                    </div>
                </div>
                <div class="canvas-container">
                    <canvas id="previewCanvas"></canvas>
                    <div class="canvas-overlay" id="overlay">
                        <div class="overlay-content">
                            <p>点击 "触发动画" 开始演示</p>
                            <p class="hint">或点击画布任意位置</p>
                        </div>
                    </div>
                </div>
                <div class="preview-info">
                    <div class="info-item">
                        <span class="label">动画状态：</span>
                        <span id="animState">待机</span>
                    </div>
                    <div class="info-item">
                        <span class="label">碎片数量：</span>
                        <span id="fragCount">0</span>
                    </div>
                    <div class="info-item">
                        <span class="label">粒子数量：</span>
                        <span id="particleCount">0</span>
                    </div>
                </div>
            </div>

            <!-- 右侧：配置面板 -->
            <div class="config-panel">
                <div class="config-header">
                    <h2>参数配置</h2>
                    <button class="btn btn-link" id="toggleAllBtn">
                        展开全部
                    </button>
                </div>

                <!-- 预设按钮 -->
                <div class="presets">
                    <h3>快速预设</h3>
                    <div class="preset-buttons">
                        <button class="preset-btn" data-preset="performance">
                            ⚡ 性能模式
                        </button>
                        <button class="preset-btn" data-preset="balanced">
                            ⚖️ 平衡模式
                        </button>
                        <button class="preset-btn" data-preset="quality">
                            ✨ 质量模式
                        </button>
                        <button class="preset-btn" data-preset="extreme">
                            🔥 极致模式
                        </button>
                    </div>
                </div>

                <!-- 配置项滚动区域 -->
                <div class="config-scroll" id="configScroll">
                    <!-- 配置组将通过 JavaScript 动态生成 -->
                </div>

                <!-- 底部操作按钮 -->
                <div class="config-footer">
                    <button class="btn btn-success" id="saveBtn">
                        💾 保存到数据库
                    </button>
                    <button class="btn btn-warning" id="loadBtn">
                        📥 从数据库加载
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast"></div>

    <!-- 加载脚本 -->
    <script src="config-panel.js"></script>
    <script src="demo.js"></script>
    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 WebGL Demo 初始化...');
            
            // 初始化配置面板
            if (typeof ConfigPanel !== 'undefined') {
                window.configPanel = new ConfigPanel();
            }
            
            // 初始化演示
            if (typeof WebGLDemo !== 'undefined') {
                window.demo = new WebGLDemo();
            }
            
            // 状态检查
            fetch('/api/health')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        updateStatus('online', `已连接 (数据库: ${data.database})`);
                    }
                })
                .catch(() => {
                    updateStatus('offline', '服务器连接失败');
                });
        });

        // 更新状态
        function updateStatus(type, text) {
            const statusEl = document.getElementById('status');
            statusEl.className = `status status-${type}`;
            statusEl.innerHTML = `<span class="status-dot"></span>${text}`;
        }

        // 显示提示消息
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type} toast-show`;
            
            setTimeout(() => {
                toast.classList.remove('toast-show');
            }, 3000);
        }

        // 暴露全局函数
        window.showToast = showToast;
        window.updateStatus = updateStatus;
    </script>
</body>
</html>
